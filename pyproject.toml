[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lapm-soil-prediction"
version = "1.0.0"
description = "Reproducible implementation of the Local Association Prediction Method"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.3.3",
  "scipy==1.15.3",
  "scikit-learn==1.7.2",
  "torch==2.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lapm*"]

[tool.ruff]
line-length = 96
target-version = "py311"
